[package]
name    = "xtask"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
anyhow     = "1.0"
bindgen    = "0.73"
clap       = { version = "4.5", features = ["derive"] }
flate2     = "1.1"
proc-macro2 = "1.0.107"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn        = { version = "2.0.119", features = ["full", "visit"] }
tar        = "0.4"
walkdir    = "2.5"
