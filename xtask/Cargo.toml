[package]
name    = "xtask"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
anyhow     = "1.0"
# bindgen's default features include `prettyplease`, which compiles the code path
# `prettyplease::unparse(&syn::parse_quote!(...))` inside bindgen — it hands its own
# `syn::File` to prettyplease. bindgen declares both deps as wide ranges that straddle
# the syn-2/syn-3 boundary (`syn >=2, <4`, `prettyplease >=0.2.7, <0.4`) and cannot
# express that they must agree on the syn major. In this graph Cargo resolves bindgen's
# `syn` to v2 (reused from the many syn-2 proc-macro crates) but its `prettyplease` to
# 0.3 (syn 3, unified with the `prettyplease = "0.3"` below), so bindgen fails to
# compile with:
#
#     error[E0277]: the trait bound `syn::File: ParseQuote` is not satisfied
#     = note: there are multiple different versions of crate `syn`
#
# xtask drives bindgen with its default rustfmt formatter (`Builder::default()`, no
# `.formatter(Prettyplease)`), so bindgen's prettyplease path is dead code here. Drop
# the feature to remove the syn-major coupling entirely. `runtime` (dynamic libclang)
# and `logging` are the other default features and are kept.
bindgen    = { version = "0.73", default-features = false, features = ["logging", "runtime"] }
clap       = { version = "4.5", features = ["derive"] }
flate2     = "1.1"
proc-macro2 = "1.0.107"
# xtask formats its own generated loadable-extension wrappers by handing a `syn::File`
# to `prettyplease::unparse` (see src/main.rs), so this prettyplease major must match
# the `syn` major xtask parses with — syn 3, hence prettyplease 0.3. This pairing is
# independent of bindgen now that bindgen no longer uses prettyplease.
prettyplease = "0.3"
quote      = "1.0"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn        = { version = "3.0.5", features = ["full", "visit"] }
tar        = "0.4"
walkdir    = "2.5"
