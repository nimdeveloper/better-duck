[package]
name                  = "better-duck-core"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
description.workspace = true
repository.workspace  = true
homepage.workspace    = true
keywords.workspace    = true
categories.workspace  = true
readme.workspace      = true

[lints]
workspace = true

[dependencies]
better-duck-sys = { workspace = true }
log           = { workspace = true }
parking_lot   = { workspace = true }
chrono        = { workspace = true, optional = true }
strum         = { workspace = true, features = ["derive"] }
rust_decimal  = { workspace = true, features = ["macros"], optional = true }
r2d2          = { workspace = true, optional = true }
tokio         = { workspace = true, features = ["rt"], optional = true }
polars        = { version = "0.55", default-features = false, optional = true }
polars-arrow  = { version = "0.55", default-features = false, optional = true }
time          = { version = "0.3", default-features = false, optional = true }
uuid          = { version = "1", default-features = false, optional = true }
better-duck-macros = { path = "../better-duck-macros", version = "0.1.0-beta.7", optional = true }

[features]
default         = ["chrono", "decimal"]
json            = ["better-duck-sys/json"]
parquet         = ["better-duck-sys/parquet"]
# Bundle DuckDB's ICU extension (timezones/collations) into the static lib. Requires a
# DuckDB archive re-vendored with icu sources (see better-duck-sys/build.rs).
icu             = ["better-duck-sys/icu"]
chrono          = ["dep:chrono"]
decimal         = ["dep:rust_decimal"]
pool            = ["dep:r2d2"]
async           = ["dep:tokio"]
udf             = ["dep:better-duck-macros"]
# Export query results via the Arrow C Data Interface (no new dependency — uses the
# ABI structs directly). Consumers can reinterpret the handles as arrow-rs FFI structs.
arrow           = []
# Polars DataFrame interop. Bridged through the Arrow C Data Interface, so it implies
# `arrow`. Pulls in `polars` (DataFrame) + `polars-arrow` (C Data Interface FFI).
polars          = ["arrow", "dep:polars", "dep:polars-arrow"]
# Bind/append `time` crate values (Date/Time/PrimitiveDateTime/OffsetDateTime/Duration)
# as DuckDB temporals. Coexists with `chrono`; independent of the DuckValue read type.
time            = ["dep:time"]
# Convert between the native `DuckUuid` and the `uuid` crate's `Uuid`.
uuid            = ["dep:uuid"]
# EXPERIMENTAL. Build for a loadable `.duckdb_extension`: links no DuckDB and routes
# every FFI call through the host's API table (see better-duck-sys). Pairs with the
# `#[duckdb_entrypoint]` macro (needs `udf` to register functions from the entrypoint).
loadable-extension = ["better-duck-sys/loadable-extension", "udf"]
derive          = ["dep:better-duck-macros"]
# Make the data derives additionally emit `better_duck_diesel` impls. Turned on by
# `better-duck-diesel/derive`; the emitted code resolves `::better_duck_diesel` in
# the user crate, so core itself gains no diesel dependency.
derive-diesel   = ["derive", "better-duck-macros/diesel"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
tempfile   = "3.27.0"
criterion  = { version = "0.8.2", features = ["html_reports"] }
tokio      = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
uuid = "1.24.0"
trybuild = "1.0"

[[bench]]
name    = "my_benchmark"
harness = false
