[package]
name                  = "better-duck-core"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
description.workspace = true
repository.workspace  = true
homepage.workspace    = true
keywords.workspace    = true
categories.workspace  = true
readme.workspace      = true

[lints]
workspace = true

[dependencies]
libduckdb-sys = { workspace = true }
log           = { workspace = true }
parking_lot   = { workspace = true }
chrono        = { workspace = true, optional = true }
strum         = { workspace = true, features = ["derive"] }
rust_decimal  = { workspace = true, features = ["macros"], optional = true }
r2d2          = { workspace = true, optional = true }
tokio         = { workspace = true, features = ["rt"], optional = true }

[features]
default         = ["bundled", "chrono", "decimal"]
bundled         = ["libduckdb-sys/bundled"]
json            = ["libduckdb-sys/json", "bundled"]
parquet         = ["libduckdb-sys/parquet", "bundled"]
buildtime_bindgen = ["libduckdb-sys/buildtime_bindgen"]
chrono          = ["dep:chrono"]
decimal         = ["dep:rust_decimal"]
pool            = ["dep:r2d2"]
async           = ["dep:tokio"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
tempfile   = "3.27.0"
criterion  = { version = "0.8.2", features = ["html_reports"] }
sysinfo    = "0.39.3"
plotters   = { version = "0.3", default-features = false, features = ["svg_backend", "all_series", "all_elements", "full_palette"] }
serde_json = "1"
serde      = { version = "1", features = ["derive"] }
tokio      = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
duckdb     = { version = "1.10505.0", features = ["bundled", "chrono", "uuid", "rust_decimal"] }
uuid = "1.24.0"

[[bench]]
name    = "my_benchmark"
harness = false

[[bench]]
name    = "comparison"
harness = false
