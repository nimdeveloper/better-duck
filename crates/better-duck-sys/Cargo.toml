[package]
name                  = "better-duck-sys"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
description           = "Vendored DuckDB C API and bindings for the better-duck workspace"
repository.workspace  = true
homepage.workspace    = true
keywords.workspace    = true
categories.workspace  = true
readme.workspace      = true
links                 = "duckdb"
build                 = "build.rs"
# Only ship what a consumer's build actually needs — not `xtask/`-adjacent
# tooling or anything used solely to regenerate the vendored archive.
include = [
    "src/**/*.rs",
    "build.rs",
    "vendor/duckdb.tar.gz",
]

[lints]
workspace = true

[dependencies]

[build-dependencies]
cc         = "1.2"
flate2     = "1.1"
tar        = "0.4"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
# Enables DuckDB's JSON extension (adds its translation units to the build).
json = []
# Enables DuckDB's Parquet extension (adds its translation units to the build).
parquet = []
# Enables DuckDB's ICU extension (timezones, collations). Requires an archive
# re-vendored with icu sources (see build.rs); `cargo run -p xtask -- upgrade-duckdb`.
icu = []
# EXPERIMENTAL. Build for a loadable `.duckdb_extension` instead of linking DuckDB:
# compiles/links no DuckDB and routes every `duckdb_*` through the host's
# `duckdb_ext_api_v1` pointer table (`src/bindings_loadable.rs`, generated by
# `xtask upgrade-duckdb --loadable-bindings` + `xtask gen-loadable-wrappers`).
# Populate the table from the extension entrypoint via `duckdb_rs_extension_api_init`.
loadable-extension = []
