[package]
name                  = "better-duck-tauri"
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
description = "Tauri v2 plugin exposing better-duck (embedded DuckDB) to the webview as a local-analytics engine"
keywords    = ["duckdb", "tauri", "plugin", "analytics", "embedded"]
categories  = ["database"]
# Required by the tauri-plugin permission tooling: must equal `package.name`.
links       = "better-duck-tauri"

[lints]
workspace = true

[dependencies]
tauri       = "2"
serde       = { workspace = true }
serde_json  = "1.0"
thiserror   = "2.0"
log         = { workspace = true }
better-duck-core   = { path = "../better-duck-core", version = "0.1.0-beta.4", optional = true }
better-duck-diesel = { path = "../better-duck-diesel", version = "0.1.0-beta.4", optional = true }
diesel             = { workspace = true, optional = true }
diesel_migrations  = { version = "2.3", optional = true }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[features]
default = ["backend-core"]
# Build the plugin on better-duck-core (+ inline migration engine). App calls `core::init()`.
backend-core = ["dep:better-duck-core"]
# Build the plugin on better-duck-diesel (shared pool + Diesel migrations). App calls `diesel::init()`.
# Also pulls better-duck-core directly so the shared DuckValue<->JSON bridge is in scope.
backend-diesel = [
    "dep:better-duck-core",
    "dep:better-duck-diesel",
    "dep:diesel",
    "dep:diesel_migrations",
]

[dev-dependencies]
tempfile = "3.27.0"
