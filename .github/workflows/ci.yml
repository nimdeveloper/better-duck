name: Rust CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  schedule:
    # The schedule runs the audit only; build jobs are gated by preflight.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel reusable release/tag validation once it has begun.
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # CI runners are ephemeral, so incremental compilation only adds I/O and cache
  # bloat with no reuse benefit — turning it off speeds every compile job.
  CARGO_INCREMENTAL: "0"
  # Fail fast on flaky registry/network instead of hanging.
  CARGO_NET_RETRY: "10"

jobs:
  preflight:
    name: Preflight
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Validate locked workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Audit DuckDB API capabilities
        run: cargo run --quiet --locked -p xtask -- audit-capabilities
      # `docs/current/` upstream is a moving target, so retain the exact
      # reference this run validated against once it advances past the
      # vendored DuckDB version.
      - name: Upload validated C API snapshot
        if: always() && hashFiles('target/xtask/api-snapshot/api.md') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: duckdb-c-api-snapshot-${{ github.run_id }}
          path: target/xtask/api-snapshot/
          if-no-files-found: error
          retention-days: 90

  warmup:
    name: Warm DuckDB cache (${{ matrix.cache }})
    needs: preflight
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - cache: default
            features: ""
          - cache: ext
            features: "--features json,parquet"
      # `icu` is deliberately not warmed: the icu shard is its only consumer, so it just
      # builds (and cross-run caches) that config itself — warming it here would add a
      # full DuckDB+ICU compile for no cross-job reuse.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-stable-deps-v1
          cache-workspace-crates: false
          save-if: false
      - uses: ./.github/actions/duckdb-cc-cache
        with:
          key-suffix: ${{ matrix.cache }}
      # Compile ONLY better-duck-sys, up front, so the cache save captures the DuckDB
      # `.a` that every downstream Linux job with this config restores — instead of N
      # parallel jobs each cold-building it and thrashing the 10 GB cache.
      - name: Compile the DuckDB C library
        run: cargo build --locked -p better-duck-sys ${{ matrix.features }}

  lint:
    name: Clippy
    needs: warmup
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-stable-deps-v1
          cache-workspace-crates: false
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
      - uses: ./.github/actions/duckdb-cc-cache
        with:
          # Clippy builds with json+parquet, so it shares the `ext` C config.
          key-suffix: ext
      - name: Run Clippy
        # Exclude the Tauri plugin here: it pulls the `tauri` framework, which on Linux needs
        # GTK/glib/webkit system libraries. It gets its own job (`plugin`) with those installed.
        run: >-
          cargo clippy --locked --workspace --exclude better-duck-tauri --all-targets
          --features "chrono,decimal,json,parquet,async,pool,udf,better-duck-diesel/r2d2"
          -- -D warnings

  linux-tests:
    name: Tests (Linux)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-stable-deps-v1
          cache-workspace-crates: false
          save-if: false
      - uses: ./.github/actions/duckdb-cc-cache
        with:
          key-suffix: default
      - name: Run package-scoped tests
        run: |
          cargo test --locked -p better-duck-core --verbose
          cargo test --locked -p better-duck-core --features udf --verbose
          cargo test --locked -p better-duck-diesel --verbose
          cargo test --locked -p better-duck-diesel --features chrono --verbose
          cargo test --locked -p better-duck-macros --lib --verbose
      - name: Verify release UDF build (panic=abort, LTO)
        run: cargo build --locked --release -p better-duck-core --features udf --verbose

  docs-and-doctests:
    name: Docs and doctests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-stable-deps-v1
          cache-workspace-crates: false
          save-if: false
      - uses: ./.github/actions/duckdb-cc-cache
        with:
          key-suffix: default
      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --exclude better-duck-tauri --no-deps --features "chrono,decimal,async,pool,udf"
      - name: Run doctests
        run: cargo test --locked --workspace --exclude better-duck-tauri --doc --features "chrono,decimal,async,pool,udf"

  feature-shards:
    name: Features (${{ matrix.name }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          # Orthogonal, additive features are exercised together in one compile rather
          # than one recompile each. Two isolation builds are kept on purpose: the empty
          # baseline, and chrono-without-decimal (the temporal backend swap is a
          # historically fragile #[cfg] split). json/parquet/icu change the C build, so
          # they live in their own cache configs and can't fold into the default combo.
          - name: core-default
            cache: default
            commands: |
              cargo test --locked -p better-duck-core --no-default-features
              cargo test --locked -p better-duck-core --no-default-features --features chrono
              cargo test --locked -p better-duck-core --features "async,pool,udf,arrow,time,uuid"
              cargo test --locked -p better-duck-diesel --features r2d2
          - name: core-polars
            cache: default
            # Polars is a heavy Rust dependency but C-neutral, so it reuses the default
            # `.a`; kept in its own shard so it doesn't lengthen core-default.
            commands: |
              cargo test --locked -p better-duck-core --features polars
          - name: ext
            cache: ext
            # json + parquet together — they don't overlap, and the combined set is the
            # one that matches the warmed `ext` cache. Folds in the C-neutral features so
            # they're exercised alongside the bundled extensions.
            commands: |
              cargo test --locked -p better-duck-core --features "async,pool,udf,json,parquet"
              cargo test --locked -p better-duck-diesel --all-features
          - name: icu
            cache: icu
            # Compiles ICU in; exercises tests/icu.rs (named timezone + collation, no LOAD).
            commands: |
              cargo test --locked -p better-duck-core --features icu
          # loadable-extension: links no DuckDB, so build-check only (default cache; a real
          # DB only exists once the .duckdb_extension is LOAD-ed into a host).
          - name: loadable-extension
            cache: default
            commands: |
              cargo build --locked -p better-duck-sys --features loadable-extension
              cargo build --locked -p better-duck-core --features loadable-extension
              cargo build --manifest-path examples/extension/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-stable-deps-v1
          cache-workspace-crates: false
          save-if: false
      - uses: ./.github/actions/duckdb-cc-cache
        with:
          key-suffix: ${{ matrix.cache }}
      - name: Run ${{ matrix.name }} configurations
        env:
          SHARD_COMMANDS: ${{ matrix.commands }}
        run: bash -euo pipefail -c "$SHARD_COMMANDS"

  windows-tests:
    name: Tests (Windows)
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: windows-stable-tests-v1
          cache-workspace-crates: false
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
      - uses: ./.github/actions/duckdb-cc-cache
        with:
          key-suffix: default
      - name: Run package-scoped tests
        run: |
          cargo test --locked -p better-duck-core --verbose
          cargo test --locked -p better-duck-core --features udf --verbose
          cargo test --locked -p better-duck-diesel --verbose

  macos-tests-and-ios-builds:
    name: Tests (macOS) and iOS builds
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: macos-stable-ios-v1
          cache-workspace-crates: false
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
      - uses: ./.github/actions/duckdb-cc-cache
        with:
          key-suffix: default
      - name: Run macOS package-scoped tests
        run: |
          cargo test --locked -p better-duck-core --verbose
          cargo test --locked -p better-duck-diesel --verbose
      - name: Add iOS targets
        run: rustup target add aarch64-apple-ios x86_64-apple-ios
      - name: Cross-build for iOS
        run: |
          cargo build --locked -p better-duck-core --target aarch64-apple-ios --verbose
          cargo build --locked -p better-duck-core --target x86_64-apple-ios --verbose

  android-build:
    name: Cross-build (Android arm64)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: android-stable-v1
          cache-workspace-crates: false
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
      - uses: ./.github/actions/duckdb-cc-cache
        with:
          # Default C config, but a distinct target so the aarch64-linux-android `.a`
          # doesn't collide with the host Linux cache.
          key-suffix: default
          target: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Cross-build for Android (arm64-v8a)
        # The Android NDK preinstalled on the runner provides the clang toolchain for
        # the bundled DuckDB C++ compile; cargo-ndk points the `cc` crate and the Rust
        # linker at it. Proves the plugin's pure-Rust stack cross-compiles for
        # aarch64-linux-android (the app-side 16 KB page linker flag lives in the app).
        run: cargo ndk -t arm64-v8a build --locked -p better-duck-core --verbose

  msrv:
    name: MSRV (Rust 1.96)
    # Not gated on `warmup`: warmup builds with stable rustc, and the cache key includes
    # the rustc version, so MSRV (1.96) has its own cache it warms across runs.
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-msrv-1.96-v1
          cache-workspace-crates: false
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
      - uses: ./.github/actions/duckdb-cc-cache
        with:
          key-suffix: default
      - name: Check workspace compiles on MSRV
        run: cargo check --locked --workspace --exclude better-duck-tauri --features "chrono,decimal,async,pool,udf"

  plugin:
    name: Tauri plugin
    needs: warmup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Soft/non-blocking until the Linux Tauri system deps are confirmed on a real run, and
    # intentionally out of `required-checks`. Promote to gating once it's green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri Linux system dependencies
        # The `tauri` framework links GTK/glib/webkit via pkg-config on Linux.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-plugin-v1
          cache-workspace-crates: false
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
      - uses: ./.github/actions/duckdb-cc-cache
        with:
          key-suffix: default
      - name: Clippy (default / arrow / backend-diesel)
        run: |
          cargo clippy --locked -p better-duck-tauri --all-targets -- -D warnings
          cargo clippy --locked -p better-duck-tauri --all-targets --features arrow -- -D warnings
          cargo clippy --locked -p better-duck-tauri --all-targets --features backend-diesel -- -D warnings
      - name: Tests
        run: |
          cargo test --locked -p better-duck-tauri
          cargo test --locked -p better-duck-tauri --features backend-diesel

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ github.event_name == 'schedule' }}
    permissions:
      contents: read
      issues: write
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Coverage
    needs: linux-tests
    # Coverage runs ONLY on direct pushes to the long-lived branches — never on pull
    # requests, and never on tag/release runs (the publish workflow `workflow_call`s
    # this file on a tag push, where `github.ref` is `refs/tags/…`, so it's excluded).
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: linux-stable-llvm-cov-v1
          cache-workspace-crates: false
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
      - uses: ./.github/actions/duckdb-cc-cache
        with:
          # Its own config: llvm-cov instruments the build (distinct rustflags →
          # distinct fingerprint), so it can't share the normal `default` `.a`.
          key-suffix: coverage
      - name: Install cargo-llvm-cov
        # Fetch the prebuilt binary instead of `cargo install` (which compiles it
        # from source — several minutes) to keep the coverage job lean.
        run: |
          set -euo pipefail
          VERSION=0.9.1
          URL="https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${VERSION}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          curl -LsSf --retry 3 "$URL" | tar xzf - -C "$HOME/.cargo/bin"
          cargo llvm-cov --version
      - name: Generate scoped coverage report
        run: |
          cargo llvm-cov --no-report -p better-duck-core --tests \
            --features "chrono,decimal,async,pool,udf" \
            --exclude-from-report better-duck-sys \
            --exclude-from-report xtask
          cargo llvm-cov --no-report -p better-duck-core --tests \
            --no-default-features \
            --exclude-from-report better-duck-sys \
            --exclude-from-report xtask
          cargo llvm-cov --no-report -p better-duck-diesel --tests \
            --all-features \
            --exclude-from-report better-duck-sys \
            --exclude-from-report xtask
          cargo llvm-cov --no-report -p better-duck-macros --lib \
            --exclude-from-report better-duck-sys \
            --exclude-from-report xtask
          cargo llvm-cov report --lcov --output-path lcov.info \
            --ignore-filename-regex '(^|[\\/])(xtask|crates[\\/]better-duck-sys)([\\/]|$)'
      - name: Upload to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ env.CODECOV_TOKEN }}
          # The job only runs on main/develop pushes, so this is always the branch name.
          override_branch: ${{ github.ref_name }}

  required-checks:
    name: Required checks
    if: ${{ always() && github.event_name != 'schedule' }}
    needs:
      - lint
      - linux-tests
      - docs-and-doctests
      - feature-shards
      - windows-tests
      - macos-tests-and-ios-builds
      - android-build
      - msrv
      - audit
      - coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI dependency
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          LINUX_RESULT: ${{ needs.linux-tests.result }}
          DOCS_RESULT: ${{ needs.docs-and-doctests.result }}
          FEATURES_RESULT: ${{ needs.feature-shards.result }}
          WINDOWS_RESULT: ${{ needs.windows-tests.result }}
          MACOS_RESULT: ${{ needs.macos-tests-and-ios-builds.result }}
          ANDROID_RESULT: ${{ needs.android-build.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          for result in \
            "$LINT_RESULT" "$LINUX_RESULT" "$DOCS_RESULT" \
            "$FEATURES_RESULT" "$WINDOWS_RESULT" "$MACOS_RESULT" \
            "$ANDROID_RESULT" "$MSRV_RESULT" "$AUDIT_RESULT"; do
            test "$result" = success
          done
          # Coverage runs only on main/develop pushes (never on PRs or tag releases),
          # so it is allowed to be skipped — but must not have failed when it did run.
          test "$COVERAGE_RESULT" = success -o "$COVERAGE_RESULT" = skipped
