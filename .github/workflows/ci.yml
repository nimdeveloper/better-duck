name: Rust CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run the security audit once a week even without a push.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check

  # Lint (Clippy)
  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        # --workspace is required, and r2d2 (a better-duck-diesel-only feature) must
        # use pkg/feature syntax: cargo validates an unqualified --features list
        # against the first workspace member (better-duck-core), which does not have
        # r2d2 (it has pool instead).
        run: cargo clippy --workspace --all-targets --features "chrono,decimal,json,parquet,async,pool,udf,better-duck-diesel/r2d2" -- -D warnings

  # Documentation
  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --features "chrono,decimal,async,pool,udf"

  # Tests — Linux (default)
  test_linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        # Scoped per-package, not `--workspace`: better-duck-core defaults to
        # chrono=on, better-duck-diesel defaults to chrono=off. A `--workspace`
        # build unifies the shared better-duck-core dependency to chrono=on (since
        # core is also tested directly with its own defaults), which does not match
        # what diesel's non-chrono code (compiled for diesel's own chrono=off) expects.
        run: |
          cargo test -p better-duck-core --verbose
          cargo test -p better-duck-core --features udf --verbose
          cargo test -p better-duck-diesel --verbose
      - name: Release build (udf) — proves it compiles under panic=abort, lto=fat
        # `cargo test --release` cannot exercise callback panic containment: Cargo
        # forces `panic = "unwind"` for test harness targets even under --release.
        # This step proves only that the udf path compiles under this workspace's
        # actual release profile; see `udf` module docs for the abort caveat.
        run: cargo build --release -p better-duck-core --features udf --verbose

  # Tests — Linux with chrono
  test_linux_chrono:
    name: Tests (Linux, +chrono)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests with chrono feature
        run: cargo test -p better-duck-diesel --features chrono --verbose

  # Doctests
  doctest:
    name: Doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run doctests
        run: cargo test --workspace --doc --features "chrono,decimal,async,pool,udf"

  # Tests — Windows
  test_windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        # Scoped per-package — see the comment on the Linux job for why. The udf
        # feature is exercised here specifically because MSVC's `duckdb_string_t`
        # layout/alignment is exactly the class of bug the udf write path can hide.
        run: |
          cargo test -p better-duck-core --verbose
          cargo test -p better-duck-core --features udf --verbose
          cargo test -p better-duck-diesel --verbose

  # Tests — macOS + iOS cross-build
  test_macos_and_ios_build:
    name: Tests (macOS) + iOS cross-build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests on macOS
        # Scoped per-package — see the comment on the Linux job for why.
        run: |
          cargo test -p better-duck-core --verbose
          cargo test -p better-duck-diesel --verbose
      - name: Add iOS targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add x86_64-apple-ios
      - name: Cross-build for iOS (aarch64)
        # Scoped to -p better-duck-core — see the comment on the Linux job for
        # why an unscoped build (which on this virtual workspace defaults to
        # building every member together) unifies better-duck-core's chrono
        # feature to "on" even though better-duck-diesel wants it off,
        # breaking diesel's `#[cfg(not(feature = "chrono"))] date_native`
        # module (it still compiles, since *diesel's own* chrono feature is
        # unaffected, but the `better_duck_core::types::date_native` module it
        # imports has been compiled out).
        run: cargo build -p better-duck-core --target aarch64-apple-ios --verbose
      - name: Cross-build for iOS Simulator (x86_64)
        run: cargo build -p better-duck-core --target x86_64-apple-ios --verbose

  # Feature matrix
  features:
    name: Feature matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core crate. `better-duck-sys` is a required (non-optional)
          # dependency, so its vendored DuckDB always compiles and links
          # regardless of feature flags — there's no more "no DuckDB linked"
          # mode to fall back to `cmd: check` for (unlike the old external
          # `libduckdb-sys`'s `bundled` feature, now removed entirely).
          - name: core/no-default-features
            package: better-duck-core
            args: --no-default-features
          - name: core/chrono-only
            package: better-duck-core
            args: --no-default-features --features chrono
          - name: core/decimal-only
            package: better-duck-core
            args: --no-default-features --features decimal
          - name: core/json
            package: better-duck-core
            args: --features json
          - name: core/parquet
            package: better-duck-core
            args: --features parquet
          # Diesel crate
          - name: diesel/default
            package: better-duck-diesel
            args: ""
          - name: diesel/chrono
            package: better-duck-diesel
            args: --features chrono
          - name: diesel/r2d2
            package: better-duck-diesel
            args: --features r2d2
          - name: diesel/all
            package: better-duck-diesel
            args: --features "chrono,decimal,r2d2"
          - name: core/async
            package: better-duck-core
            args: --features async
          - name: core/pool
            package: better-duck-core
            args: --features pool
          - name: core/async-pool
            package: better-duck-core
            args: --features "async,pool"
          # compile-only: just cfg-correctness of async/pool, no need to
          # exercise them at runtime for this check.
          - name: core/no-default-async-pool
            package: better-duck-core
            args: --no-default-features --features "async,pool"
            cmd: check
          - name: core/udf
            package: better-duck-core
            args: --features udf
          # catches #[cfg(feature = "chrono")] mistakes in udf marshalling code
          # that the default (chrono-on) build would hide.
          - name: core/udf-no-chrono
            package: better-duck-core
            args: --no-default-features --features udf
          - name: core/udf-all
            package: better-duck-core
            args: --features "udf,async,pool,json"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Check / test ${{ matrix.name }}
        run: cargo ${{ matrix.cmd || 'test' }} -p ${{ matrix.package }} ${{ matrix.args }}

  # MSRV
  msrv:
    name: MSRV (Rust 1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.96
      - name: Check workspace compiles on MSRV
        run: cargo check --workspace --features "chrono,decimal,async,pool,udf"

  # Security audit
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    # Only block on push/PR — the weekly schedule run is advisory only.
    continue-on-error: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Coverage
  coverage:
    name: Coverage (llvm-cov → Codecov)
    runs-on: ubuntu-latest
    # Coverage upload requires CODECOV_TOKEN; job is advisory if the secret
    # is absent (e.g. on forks or before the secret is configured).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage report
        run: |
          cargo llvm-cov --workspace --features "chrono,decimal,async,pool,udf" \
            --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
