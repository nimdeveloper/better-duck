name: Rust CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  schedule:
    # The schedule runs the audit only; build jobs are gated by preflight.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel reusable release/tag validation once it has begun.
  cancel-in-progress: ${{ github.event_name != 'workflow_call' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Preflight
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Validate locked workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

  lint:
    name: Clippy
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: linux-stable-deps-v1
          cache-workspace-crates: false
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
      - name: Run Clippy
        run: >-
          cargo clippy --locked --workspace --all-targets
          --features "chrono,decimal,json,parquet,async,pool,udf,better-duck-diesel/r2d2"
          -- -D warnings

  linux-tests:
    name: Tests (Linux)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: linux-stable-deps-v1
          cache-workspace-crates: false
          save-if: false
      - name: Run package-scoped tests
        run: |
          cargo test --locked -p better-duck-core --verbose
          cargo test --locked -p better-duck-core --features udf --verbose
          cargo test --locked -p better-duck-diesel --verbose
          cargo test --locked -p better-duck-diesel --features chrono --verbose
          cargo test --locked -p better-duck-macros --lib --verbose
      - name: Verify release UDF build (panic=abort, LTO)
        run: cargo build --locked --release -p better-duck-core --features udf --verbose

  docs-and-doctests:
    name: Docs and doctests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: linux-stable-deps-v1
          cache-workspace-crates: false
          save-if: false
      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --no-deps --features "chrono,decimal,async,pool,udf"
      - name: Run doctests
        run: cargo test --locked --workspace --doc --features "chrono,decimal,async,pool,udf"

  feature-shards:
    name: Features (${{ matrix.name }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: core-minimal
            commands: |
              cargo test --locked -p better-duck-core --no-default-features
              cargo test --locked -p better-duck-core --no-default-features --features chrono
              cargo test --locked -p better-duck-core --no-default-features --features decimal
          - name: core-extensions
            commands: |
              cargo test --locked -p better-duck-core --features json
              cargo test --locked -p better-duck-core --features parquet
              cargo test --locked -p better-duck-core --features async
              cargo test --locked -p better-duck-core --features pool
              cargo test --locked -p better-duck-core --features "async,pool"
              cargo check --locked -p better-duck-core --no-default-features --features "async,pool"
          - name: core-udf
            commands: |
              cargo test --locked -p better-duck-core --no-default-features --features udf
              cargo test --locked -p better-duck-core --features "udf,async,pool,json"
          - name: diesel-features
            commands: |
              cargo test --locked -p better-duck-diesel --features r2d2
              cargo test --locked -p better-duck-diesel --all-features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: linux-stable-deps-v1
          cache-workspace-crates: false
          save-if: false
      - name: Run ${{ matrix.name }} configurations
        env:
          SHARD_COMMANDS: ${{ matrix.commands }}
        run: bash -euo pipefail -c "$SHARD_COMMANDS"

  windows-tests:
    name: Tests (Windows)
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: windows-stable-tests-v1
          cache-workspace-crates: false
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
      - name: Run package-scoped tests
        run: |
          cargo test --locked -p better-duck-core --verbose
          cargo test --locked -p better-duck-core --features udf --verbose
          cargo test --locked -p better-duck-diesel --verbose

  macos-tests-and-ios-builds:
    name: Tests (macOS) and iOS builds
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: macos-stable-ios-v1
          cache-workspace-crates: false
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
      - name: Run macOS package-scoped tests
        run: |
          cargo test --locked -p better-duck-core --verbose
          cargo test --locked -p better-duck-diesel --verbose
      - name: Add iOS targets
        run: rustup target add aarch64-apple-ios x86_64-apple-ios
      - name: Cross-build for iOS
        run: |
          cargo build --locked -p better-duck-core --target aarch64-apple-ios --verbose
          cargo build --locked -p better-duck-core --target x86_64-apple-ios --verbose

  msrv:
    name: MSRV (Rust 1.96)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: linux-msrv-1.96-v1
          cache-workspace-crates: false
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
      - name: Check workspace compiles on MSRV
        run: cargo check --locked --workspace --features "chrono,decimal,async,pool,udf"

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ github.event_name == 'schedule' }}
    permissions:
      contents: read
      issues: write
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Coverage
    needs: linux-tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: linux-stable-llvm-cov-v1
          cache-workspace-crates: false
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Generate scoped coverage report
        run: |
          cargo llvm-cov --no-report -p better-duck-core --tests \
            --features "chrono,decimal,async,pool,udf" \
            --exclude-from-report better-duck-sys \
            --exclude-from-report xtask
          cargo llvm-cov --no-report -p better-duck-core --tests \
            --no-default-features \
            --exclude-from-report better-duck-sys \
            --exclude-from-report xtask
          cargo llvm-cov --no-report -p better-duck-diesel --tests \
            --all-features \
            --exclude-from-report better-duck-sys \
            --exclude-from-report xtask
          cargo llvm-cov --no-report -p better-duck-macros --lib \
            --exclude-from-report better-duck-sys \
            --exclude-from-report xtask
          cargo llvm-cov report --lcov --output-path lcov.info \
            --ignore-filename-regex '(^|[\\/])(xtask|crates[\\/]better-duck-sys)([\\/]|$)'
      - name: Upload to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ env.CODECOV_TOKEN }}

  required-checks:
    name: Required checks
    if: ${{ always() && github.event_name != 'schedule' }}
    needs:
      - lint
      - linux-tests
      - docs-and-doctests
      - feature-shards
      - windows-tests
      - macos-tests-and-ios-builds
      - msrv
      - audit
      - coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI dependency
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          LINUX_RESULT: ${{ needs.linux-tests.result }}
          DOCS_RESULT: ${{ needs.docs-and-doctests.result }}
          FEATURES_RESULT: ${{ needs.feature-shards.result }}
          WINDOWS_RESULT: ${{ needs.windows-tests.result }}
          MACOS_RESULT: ${{ needs.macos-tests-and-ios-builds.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          for result in \
            "$LINT_RESULT" "$LINUX_RESULT" "$DOCS_RESULT" \
            "$FEATURES_RESULT" "$WINDOWS_RESULT" "$MACOS_RESULT" \
            "$MSRV_RESULT" "$AUDIT_RESULT" "$COVERAGE_RESULT"; do
            test "$result" = success
          done
