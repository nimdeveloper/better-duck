# rustfmt.toml
#
# Stable-channel options only. This project builds and formats on stable Rust, where
# rustfmt ignores nightly-only options (and warns about them). Every option below is
# accepted on the stable channel, so `cargo fmt` runs cleanly with no warnings.
#
# Nightly-only options that were previously listed here (and silently ignored on stable)
# have been removed: wrap_comments, comment_width, format_code_in_doc_comments,
# imports_granularity, group_imports, condense_wildcard_suffixes, overflow_delimited_expr,
# where_single_line, control_brace_style, match_arm_blocks, error_on_line_overflow, and
# the unrecognised license_template_path / reorder_imports_in_group. To use any of those,
# run `cargo +nightly fmt` with them re-added locally.

# Maximum line width (community standard).
max_width = 100

# Indentation.
tab_spaces = 4

# Sort `use` declarations within each import block.
reorder_imports = true

# Prefer compact formatting where it fits within max_width.
use_small_heuristics = "Max"

# Always lay out multiline function parameters vertically.
fn_params_layout = "Vertical"

# Keep a trailing comma after a block-bodied match arm.
match_block_trailing_comma = true
