# Deliberately its own workspace (empty `[workspace]` table below), not a
# member of the root `better-duck` workspace. It depends on the external
# `duckdb` crate for the in-process comparison, which pulls in the external
# `libduckdb-sys` (`links = "duckdb"`) — that collides with our own
# `better-duck-sys` (also `links = "duckdb"`) if both ever end up in one
# unified Cargo.lock. Keeping this crate's dependency resolution separate is
# what lets the comparison benchmark keep using the real `duckdb` crate at
# all, without dragging that conflict into the main workspace.
[workspace]

[package]
name       = "bench-comparison"
version    = "0.1.0-beta.3"
edition    = "2021"
publish    = false

[dependencies]
better-duck-core = { path = "../crates/better-duck-core", features = ["chrono", "decimal"] }
duckdb       = { version = "1.10505.0", features = ["bundled", "chrono", "uuid", "rust_decimal"] }
chrono       = "0.4.45"
plotters     = { version = "0.3", default-features = false, features = ["svg_backend", "all_series", "all_elements", "full_palette"] }
rust_decimal = { version = "1.42.1", default-features = false }
serde        = { version = "1", features = ["derive"] }
sysinfo      = "0.39.3"
uuid         = "1.24.0"

[[bench]]
name    = "comparison"
harness = false
